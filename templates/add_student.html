<!DOCTYPE html>
<html>

<head>

    <title>Add Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<h1>Add Student</h1>

<form method="POST">

    <label>Name:</label>

    <input type="text"
           name="name"
           required>

    <label>Register Number:</label>

    <input type="text"
           name="register_no"
           required>

    <label>Department:</label>

    <input type="text"
           name="department"
           required>

    <button type="submit">
        Add Student
    </button>

</form>

<br>

<a href="/">Back to Home</a>

</body>

</html>
