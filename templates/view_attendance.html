<!DOCTYPE html>
<html>

<head>

    <title>View Attendance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<h1>Attendance Records</h1>

<table>

<tr>

    <th>Register No</th>

    <th>Name</th>

    <th>Subject</th>

    <th>Date</th>

    <th>Status</th>

</tr>

{% for record in records %}

<tr>

    <td>
        {{ record.register_no }}
    </td>

    <td>
        {{ record.name }}
    </td>

    <td>
        {{ record.subject }}
    </td>

    <td>
        {{ record.attendance_date }}
    </td>

    <td>
        {{ record.status }}
    </td>

</tr>

{% endfor %}

</table>

<br>

<a href="/">Back to Home</a>

</body>

</html>
